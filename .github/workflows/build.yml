name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Build x64 ASI
        shell: pwsh
        run: msbuild .\GTA5EnhancedStoryTrainer.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: GTA5EnhancedStoryTrainer
          path: build/GTA5EnhancedStoryTrainer.asi
