name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
      - name: Checkout ReShade 6.8.0 SDK
        shell: pwsh
        run: |
          git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git .\deps\reshade
          git -C .\deps\reshade submodule update --init --depth 1 -- deps/imgui
      - name: Build x64 ASI
        shell: pwsh
        run: msbuild .\GTA5EnhancedStoryTrainer.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Build independent ReShade add-on
        shell: pwsh
        run: msbuild .\GTA5EnhancedStoryTrainerIndependent.vcxproj /m /p:Configuration=Release /p:Platform=x64 "/p:ReShadeSDKDir=$env:GITHUB_WORKSPACE\deps\reshade"
      - name: Build RAGE Plugin Hook Story Mode plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\build | Out-Null
          msbuild .\GTA5EnhancedStoryTrainerRPH.csproj /restore /p:Configuration=Release /verbosity:normal 2>&1 | Tee-Object -FilePath .\build\rph-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) { exit $buildExit }
      - name: Upload ASI
        uses: actions/upload-artifact@v4
        with:
          name: GTA5EnhancedStoryTrainer
          path: build/GTA5EnhancedStoryTrainer.asi
      - name: Upload independent add-on
        uses: actions/upload-artifact@v4
        with:
          name: GTA5EnhancedStoryTrainer-Independent
          path: build/independent/GTA5EnhancedStoryTrainerIndependent.addon64
      - name: Upload working RPH plugin
        uses: actions/upload-artifact@v4
        with:
          name: GTA5EnhancedStoryTrainer-RPH
          path: build/rph/GTA5EnhancedStoryTrainer.RPH.dll
      - name: Upload RPH build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTA5EnhancedStoryTrainer-RPH-build-log
          path: build/rph-build.log
          if-no-files-found: ignore
